# ═══════════════════════════════════════════════════════════
# factory.conf — One-Click Setup Configuration
#
# Edit this file BEFORE running: bash setup.sh
# The setup script reads this to configure everything.
# ═══════════════════════════════════════════════════════════

# ── WHERE TO DEPLOY THE FACTORY ────────────────────────────
# Options: local | aws | azure | gcp | hetzner | digitalocean
FACTORY_TARGET=local

# ── LOCAL RACK SETTINGS (only if FACTORY_TARGET=local) ─────
# Does your machine have an NVIDIA GPU for local LLM inference?
HAS_GPU=true
# GPU model (for documentation only — Ollama auto-detects)
GPU_MODEL=rtx4090

# ── CLOUD SETTINGS (only if FACTORY_TARGET != local) ───────
# Domain name pointed to the cloud server IP
CLOUD_DOMAIN=factory.yourdomain.com
# SSH key path (for provisioning)
SSH_KEY_PATH=~/.ssh/id_rsa

# AWS specific
AWS_REGION=us-east-1
AWS_INSTANCE_TYPE=t3.xlarge          # 4 vCPU, 16GB RAM
AWS_AMI=ami-0c7217cdde317cfec        # Ubuntu 24.04 LTS us-east-1
AWS_KEY_PAIR_NAME=factory-key
AWS_SECURITY_GROUP=factory-sg
AWS_VOLUME_SIZE=100                   # GB

# Azure specific
AZURE_REGION=eastus
AZURE_VM_SIZE=Standard_D4s_v3        # 4 vCPU, 16GB RAM
AZURE_RESOURCE_GROUP=factory-rg
AZURE_IMAGE=Canonical:ubuntu-24_04-lts:server:latest

# GCP specific
GCP_PROJECT=your-gcp-project-id
GCP_ZONE=us-central1-a
GCP_MACHINE_TYPE=e2-standard-4       # 4 vCPU, 16GB RAM
GCP_IMAGE_FAMILY=ubuntu-2404-lts-amd64
GCP_IMAGE_PROJECT=ubuntu-os-cloud
GCP_DISK_SIZE=100                    # GB

# Hetzner specific
HETZNER_API_TOKEN=your-hetzner-api-token
HETZNER_SERVER_TYPE=cx32             # 4 vCPU, 8GB RAM — $7/mo
HETZNER_LOCATION=fsn1

# DigitalOcean specific
DO_API_TOKEN=your-do-token
DO_SIZE=s-4vcpu-8gb                  # 4 vCPU, 8GB RAM — $48/mo
DO_REGION=nyc3

# ── LLM API KEYS ──────────────────────────────────────────
ANTHROPIC_API_KEY=sk-ant-api03-your-key-here
OPENAI_API_KEY=sk-your-key-here
GOOGLE_AI_API_KEY=your-google-ai-key
DEEPSEEK_API_KEY=your-deepseek-key
META_API_KEY=your-together-ai-key

# ── CEO COMMUNICATION ─────────────────────────────────────
TELEGRAM_BOT_TOKEN=123456789:ABCdefGhIjKlMnOpQrStUvWxYz
TELEGRAM_CEO_CHAT_ID=123456789

# WhatsApp (optional)
WHATSAPP_PHONE_NUMBER_ID=
WHATSAPP_ACCESS_TOKEN=
WHATSAPP_CEO_PHONE=

# ── MISC ───────────────────────────────────────────────────
GITHUB_TOKEN=ghp_your-github-token
PHASE_BUDGET_LIMIT=50
TOTAL_BUDGET_LIMIT=200
